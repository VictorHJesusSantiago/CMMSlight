spring.application.name=cmms-api

spring.datasource.url=jdbc:postgresql://localhost:5432/cmmslight
spring.datasource.username=cmmslight
spring.datasource.password=cmmslight

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

cmms.storage.base-dir=./data/attachments

cmms.backup.directory=./data/backups
cmms.backup.pg-dump-path=pg_dump
cmms.backup.psql-path=psql
cmms.backup.host=localhost
cmms.backup.port=5432
cmms.backup.database=cmmslight
cmms.backup.username=cmmslight

cmms.reports.directory=./data/reports
